[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lingnian-local-node"
version = "0.2.0"
requires-python = ">=3.11,<3.13"
dependencies = ["cryptography>=50,<51", "httpx>=0.28,<1", "pydantic>=2.13,<3", "keyring>=25,<26"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lingnian_node*"]
